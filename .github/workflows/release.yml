name: Release

# Security note: All run: blocks use env vars, not direct expression injection.
# Version outputs come from our own controlled version job, not user input.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  version:
    name: Check version & create tag
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      released: ${{ steps.check.outputs.released }}
      host_version: ${{ steps.check.outputs.host_version }}
      ai_version: ${{ steps.check.outputs.ai_version }}
      launcher_version: ${{ steps.check.outputs.launcher_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: iyulab/Filer
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check if version needs release
        id: check
        shell: bash
        run: |
          UI_VERSION=$(node -p "require('./src/ui/package.json').version")
          HOST_VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/host/Directory.Build.props)
          AI_VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/ai/Directory.Build.props)
          LAUNCHER_VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/launcher/Directory.Build.props)
          TAG="v${UI_VERSION}"

          echo "version=${UI_VERSION}" >> "$GITHUB_OUTPUT"
          echo "host_version=${HOST_VERSION}" >> "$GITHUB_OUTPUT"
          echo "ai_version=${AI_VERSION}" >> "$GITHUB_OUTPUT"
          echo "launcher_version=${LAUNCHER_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Component versions: ui=${UI_VERSION}, host=${HOST_VERSION}, ai=${AI_VERSION}, launcher=${LAUNCHER_VERSION}"

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists, skipping release"
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${UI_VERSION} detected, creating tag"
            git tag "${TAG}"
            git push origin "${TAG}"
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

  changelog:
    name: Generate changelog
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.changelog.outputs.changes || steps.fallback.outputs.changes || 'Initial release' }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: iyulab/Filer
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Generate changelog from conventional commits
        id: changelog
        continue-on-error: true
        uses: requarks/changelog-action@v1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag: ${{ needs.version.outputs.tag }}
          excludeTypes: ''

      - name: Fallback changelog for first release
        if: steps.changelog.outcome == 'failure'
        run: echo "changes=Initial release" >> "$GITHUB_OUTPUT"
        id: fallback

  build-host:
    name: Build filer-host
    needs: version
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/build-dotnet.yml
    secrets: inherit
    with:
      solution: FilerAI.Host.slnx
      working-directory: src/host
      test-filter: "FullyQualifiedName!~Live&FullyQualifiedName!~GPUStack&FullyQualifiedName!~FilerAI.Mcp.Tests"
      publish-project: src/host/src/FilerAI.Host/FilerAI.Host.csproj
      runtime: win-x64
      artifact-name: filer-host-win-x64

  build-ai:
    name: Build filer-ai
    needs: version
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/build-dotnet.yml
    secrets: inherit
    with:
      solution: FilerAI.slnx
      working-directory: src/ai
      test-filter: "FullyQualifiedName!~Integration&FullyQualifiedName!~Live&FullyQualifiedName!~OopsInstaller&FullyQualifiedName!~InstallOops_BinaryAvailable"
      publish-project: src/ai/src/FilerAI.Cli/FilerAI.Cli.csproj
      runtime: win-x64
      artifact-name: filer-ai-win-x64

  build-launcher:
    name: Build Filer.Launcher
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          repository: iyulab/Filer
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test src/launcher/tests/Filer.Launcher.Tests/ --verbosity normal

      - name: Publish
        run: dotnet publish src/launcher/Filer.Launcher.csproj -c Release -r win-x64 --self-contained -o publish/launcher

      - name: Sign launcher binary (must precede NSIS build)
        # Pinned to a specific commit SHA in iyulab/code-sign for supply-chain
        # safety; bump intentionally when the action is updated.
        uses: iyulab/code-sign@2a87f96983a3e79695eb5e8e98566650181abb7e
        with:
          # The launcher is published with PublishSingleFile=true, so a single
          # self-contained Filer.Launcher.exe bundles all runtime libraries.
          files: ${{ github.workspace }}/publish/launcher/Filer.Launcher.exe

      - name: Install NSIS
        run: choco install nsis -y --no-progress
        shell: cmd

      - name: Build NSIS installer
        shell: bash
        env:
          UI_VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "Installer version (UI): $UI_VERSION"
          cp src/launcher/appsettings.json publish/launcher/ 2>/dev/null || true
          cp src/ui/build/icon.ico src/launcher/installer/
          WIN_PUBLISH_DIR="$(cd publish/launcher && pwd -W | sed 's|/|\\|g')"
          MSYS_NO_PATHCONV=1 "/c/Program Files (x86)/NSIS/makensis.exe" \
            /INPUTCHARSET UTF8 \
            /DVERSION=${UI_VERSION} \
            "/DPUBLISH_DIR=${WIN_PUBLISH_DIR}" \
            src/launcher/installer/launcher-installer.nsi
          mv src/launcher/installer/Filer-setup.exe publish/

      - name: Sign NSIS installer
        # Pinned to a specific commit SHA in iyulab/code-sign for supply-chain
        # safety; bump intentionally when the action is updated.
        uses: iyulab/code-sign@2a87f96983a3e79695eb5e8e98566650181abb7e
        with:
          files: ${{ github.workspace }}/publish/Filer-setup.exe

      - uses: actions/upload-artifact@v7
        with:
          name: filer-launcher-win-x64
          path: publish/launcher/
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: filer-setup
          path: publish/Filer-setup.exe
          retention-days: 1

  build-ui:
    name: Build filer-ui (Windows)
    needs: version
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/build-electron.yml
    with:
      os: windows-latest
      platform-flag: '--win'
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      AI_CONNECTION_STRING: ${{ secrets.AI_CONNECTION_STRING }}

  build-store-installer:
    name: Build offline installer (Microsoft Store)
    # Must run after ui/host/ai/launcher are built and signed: the offline payload embeds their
    # published output directly, so this cannot be folded into build-launcher.
    needs: [version, build-ui, build-host, build-ai, build-launcher]
    if: needs.version.outputs.released == 'true'
    runs-on: windows-latest
    # Signing uses an OIDC federated credential, which requires the 'production' environment.
    # No job-level `permissions:` block: release.yml already grants id-token: write at the
    # workflow level, and the sibling build-launcher job relies on that same grant. Do not copy
    # the per-job permissions pattern from build-electron.yml/build-dotnet.yml — those are
    # reusable workflow_call files and declare their own.
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          repository: iyulab/Filer
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Download component artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # The runtime layer is NOT rebuilt here. It comes from the pinned artifact that
      # pin-ui-runtime.yml built and signed once, so the web manifest and this installer seed
      # ship the same bytes rather than two independently produced trees with two chances to
      # diverge. src/ui/electron-runtime.lock.json is the single source for where it lives.
      - name: Read the pinned runtime lock
        id: lock
        shell: pwsh
        run: |
          $lock = Get-Content src/ui/electron-runtime.lock.json -Raw | ConvertFrom-Json
          # Hard-fail rather than emit a half-formed seed. The lock is updated by a manual,
          # cross-repo owner paste that can lag a release tag reaching CI; a seed built against
          # an incomplete lock would be missing its entire runtime layer and would not be
          # runnable, while still looking like a successful build.
          foreach ($f in 'runtimeId', 'sha256', 'url', 'size') {
            if ([string]::IsNullOrWhiteSpace([string]$lock.$f)) {
              throw "electron-runtime.lock.json is missing '$f' -- run pin-ui-runtime.yml and paste its four values before releasing"
            }
          }
          "id=$($lock.runtimeId)"   | Out-File $env:GITHUB_OUTPUT -Append
          "sha=$($lock.sha256)"     | Out-File $env:GITHUB_OUTPUT -Append
          "url=$($lock.url)"        | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Pinned runtime $($lock.runtimeId) (electron $($lock.electronVersion))"

      - name: Fetch and verify the pinned runtime layer
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/ui-runtime.zip"
          Invoke-WebRequest -Uri "${{ steps.lock.outputs.url }}" -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          # The lock's hash is the whole reason this asset can be trusted without rebuilding it.
          # Checking it here means a swapped or truncated asset fails the release instead of
          # being sealed into an installer that is then submitted to the Store, where 10.2.9
          # guarantees it will never be updated.
          if ($actual -ne "${{ steps.lock.outputs.sha }}".ToLower()) {
            throw "runtime zip sha256 mismatch`n  expected ${{ steps.lock.outputs.sha }}`n  actual   $actual"
          }
          Expand-Archive $zip -DestinationPath ui-runtime -Force
          if (-not (Test-Path ui-runtime/Filer.exe)) { throw "pinned runtime has no Filer.exe" }
          if (Test-Path ui-runtime/resources/app.asar) { throw "pinned runtime contains an app layer" }

      # release.yml publishes one monolithic ui artifact for as long as the runtime-pin handoff's
      # section 2 deprecation window is open, so the app layer is carved out here. The split is
      # exactly: app layer = resources/app.asar at that path, and nothing else.
      - name: Carve the app layer
        shell: pwsh
        run: |
          $src = 'artifacts/electron-dist-win/resources/app.asar'
          if (-not (Test-Path $src)) { throw "no app.asar in artifacts/electron-dist-win" }
          New-Item -ItemType Directory -Force ui-app/resources | Out-Null
          Copy-Item $src ui-app/resources/app.asar
          # Nothing else is copied on purpose: any extra file here would be seeded into the slot
          # and then survive composition, since UiComposer only adds and overwrites, never prunes.

      # Both -UiSource and -UiRuntimeSource accept a plain directory (Expand-Source), so the
      # carved trees and the expanded runtime go straight through with no re-zipping.
      - name: Assemble seed payload
        shell: pwsh
        env:
          UI_VERSION: ${{ needs.version.outputs.version }}
          HOST_VERSION: ${{ needs.version.outputs.host_version }}
          AI_VERSION: ${{ needs.version.outputs.ai_version }}
          LAUNCHER_VERSION: ${{ needs.version.outputs.launcher_version }}
        run: |
          pwsh -File scripts/build-offline-payload.ps1 `
            -UiSource ui-app `
            -UiRuntimeSource ui-runtime `
            -UiRuntimeId "${{ steps.lock.outputs.id }}" `
            -HostSource artifacts/filer-host-win-x64 `
            -AiSource artifacts/filer-ai-win-x64 `
            -UiVersion "$env:UI_VERSION" `
            -HostVersion "$env:HOST_VERSION" `
            -AiVersion "$env:AI_VERSION" `
            -LauncherVersion "$env:LAUNCHER_VERSION" `
            -OutDir payload

      - name: Install NSIS
        run: choco install nsis -y --no-progress
        shell: cmd

      - name: Build offline installer
        shell: pwsh
        env:
          UI_VERSION: ${{ needs.version.outputs.version }}
        run: |
          Copy-Item src/ui/build/icon.ico src/launcher/installer/ -Force
          $launcher = (Resolve-Path artifacts/filer-launcher-win-x64).Path
          $payload  = (Resolve-Path payload).Path
          & "C:\Program Files (x86)\NSIS\makensis.exe" /INPUTCHARSET UTF8 `
            "/DVERSION=$env:UI_VERSION" `
            "/DPUBLISH_DIR=$launcher" "/DOFFLINE_PAYLOAD_DIR=$payload" /DSILENT_UI `
            src/launcher/installer/launcher-installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Force publish | Out-Null
          Move-Item src/launcher/installer/Filer-setup.exe publish/Filer-setup-offline.exe

      - name: Sign offline installer
        # Pinned to a commit SHA for supply-chain safety; bump intentionally.
        uses: iyulab/code-sign@2a87f96983a3e79695eb5e8e98566650181abb7e
        with:
          files: ${{ github.workspace }}/publish/Filer-setup-offline.exe

      - uses: actions/upload-artifact@v7
        with:
          name: filer-setup-offline
          path: publish/Filer-setup-offline.exe
          retention-days: 1

  publish:
    name: Publish release
    # All build-* jobs already sign their binaries via the iyulab/code-sign
    # composite action, so this job only needs to package and publish.
    needs: [version, changelog, build-ui, build-host, build-ai, build-launcher]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: iyulab/Filer
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release artifacts
        shell: bash
        env:
          UI_VERSION: ${{ needs.version.outputs.version }}
          HOST_VERSION: ${{ needs.version.outputs.host_version }}
          AI_VERSION: ${{ needs.version.outputs.ai_version }}
          LAUNCHER_VERSION: ${{ needs.version.outputs.launcher_version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p release-artifacts
          cp artifacts/filer-setup/Filer-setup.exe release-artifacts/

          cd artifacts/electron-dist-win && zip -r ../../release-artifacts/filer-ui-win-x64.zip . && cd ../..
          cd artifacts/filer-host-win-x64 && zip -r ../../release-artifacts/filer-host-win-x64.zip . && cd ../..
          cd artifacts/filer-ai-win-x64 && zip -r ../../release-artifacts/filer-ai-win-x64.zip . && cd ../..
          cd artifacts/filer-launcher-win-x64 && zip -r ../../release-artifacts/filer-launcher-win-x64.zip . && cd ../..

          cd release-artifacts
          UI_SHA=$(sha256sum filer-ui-win-x64.zip | cut -d' ' -f1)
          UI_SIZE=$(stat -c%s filer-ui-win-x64.zip)
          HOST_SHA=$(sha256sum filer-host-win-x64.zip | cut -d' ' -f1)
          HOST_SIZE=$(stat -c%s filer-host-win-x64.zip)
          AI_SHA=$(sha256sum filer-ai-win-x64.zip | cut -d' ' -f1)
          AI_SIZE=$(stat -c%s filer-ai-win-x64.zip)
          LAUNCHER_SHA=$(sha256sum filer-launcher-win-x64.zip | cut -d' ' -f1)
          LAUNCHER_SIZE=$(stat -c%s filer-launcher-win-x64.zip)

          BASE_URL="https://github.com/iyulab/Filer-releases/releases/download/${TAG}"

          node -e "
          const m = {
            launcher: {
              version: '${LAUNCHER_VERSION}',
              artifacts: { 'win-x64': { url: '${BASE_URL}/filer-launcher-win-x64.zip', sha256: '${LAUNCHER_SHA}', size: ${LAUNCHER_SIZE} } }
            },
            ui: {
              version: '${UI_VERSION}', minHost: '${HOST_VERSION}', minAi: '${AI_VERSION}',
              artifacts: { 'win-x64': { url: '${BASE_URL}/filer-ui-win-x64.zip', sha256: '${UI_SHA}', size: ${UI_SIZE} } }
            },
            host: {
              version: '${HOST_VERSION}',
              artifacts: { 'win-x64': { url: '${BASE_URL}/filer-host-win-x64.zip', sha256: '${HOST_SHA}', size: ${HOST_SIZE} } }
            },
            ai: {
              version: '${AI_VERSION}',
              artifacts: { 'win-x64': { url: '${BASE_URL}/filer-ai-win-x64.zip', sha256: '${AI_SHA}', size: ${AI_SIZE} } }
            }
          };
          require('fs').writeFileSync('latest.json', JSON.stringify(m, null, 2));
          "

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ needs.version.outputs.tag }}
          name: >-
            Filer ${{ needs.version.outputs.tag }}
            (host ${{ needs.version.outputs.host_version }},
            ai ${{ needs.version.outputs.ai_version }},
            launcher ${{ needs.version.outputs.launcher_version }})
          body: ${{ needs.changelog.outputs.body }}
          files: release-artifacts/*

      - name: Delete all intermediate artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            electron-dist-win
            filer-host-win-x64
            filer-ai-win-x64
            filer-launcher-win-x64
            filer-setup
