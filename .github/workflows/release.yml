name: Release

# Security note: All run: blocks use env vars, not direct expression injection.
# Version outputs come from our own controlled version job, not user input.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  version:
    name: Check version & create tag
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      released: ${{ steps.check.outputs.released }}
      host_version: ${{ steps.check.outputs.host_version }}
      ai_version: ${{ steps.check.outputs.ai_version }}
      launcher_version: ${{ steps.check.outputs.launcher_version }}
      ui_shell: ${{ steps.check.outputs.ui_shell }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: iyulab/Filer
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check if version needs release
        id: check
        shell: bash
        run: |
          UI_VERSION=$(node -p "require('./src/ui/package.json').version")
          HOST_VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/host/Directory.Build.props)
          AI_VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/ai/Directory.Build.props)
          LAUNCHER_VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/launcher/Directory.Build.props)
          TAG="v${UI_VERSION}"

          echo "version=${UI_VERSION}" >> "$GITHUB_OUTPUT"
          echo "host_version=${HOST_VERSION}" >> "$GITHUB_OUTPUT"
          echo "ai_version=${AI_VERSION}" >> "$GITHUB_OUTPUT"
          echo "launcher_version=${LAUNCHER_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # Which window this tag releases: scripts/ui-shell.txt in the app repository at the tag (absent = electron). Versioned
          # with the code, so a re-run of an old tag releases what it released then. Flipping it to tauri is the swap release.
          UI_SHELL=electron
          if [ -f scripts/ui-shell.txt ]; then UI_SHELL=$(tr -d '[:space:]' < scripts/ui-shell.txt); fi
          case "${UI_SHELL}" in electron|tauri) ;; *) echo "scripts/ui-shell.txt names '${UI_SHELL}' -- electron or tauri"; exit 1 ;; esac
          echo "ui_shell=${UI_SHELL}" >> "$GITHUB_OUTPUT"
          echo "Component versions: ui=${UI_VERSION} (${UI_SHELL}), host=${HOST_VERSION}, ai=${AI_VERSION}, launcher=${LAUNCHER_VERSION}"

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists, skipping release"
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${UI_VERSION} detected, creating tag"
            git tag "${TAG}"
            git push origin "${TAG}"
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

  changelog:
    name: Generate changelog
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: iyulab/Filer
          token: ${{ secrets.RELEASE_TOKEN }}
          ref: ${{ needs.version.outputs.tag }}

      # The release body is the curated docs/releases/<tag>.md from the iyulab/Filer checkout, and only that. This
      # repository is public; the source repository is not, and its commit subjects carry internal tracking text, so a
      # digest of them must not be published (it was, under "Changes since", until 2026-10). A tag without curated notes
      # stops here — a release with a placeholder or raw-subject body is worse than one that stops.
      - name: Compose release notes
        id: notes
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES="docs/releases/${TAG}.md"
          if [ ! -s "${NOTES}" ]; then
            echo "::error::${NOTES} is missing or empty in iyulab/Filer at ${TAG} — write the curated notes before tagging"
            exit 1
          fi
          {
            echo "body<<NOTES_EOF"
            cat "${NOTES}"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  build-host:
    name: Build filer-host
    needs: version
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/build-dotnet.yml
    secrets: inherit
    with:
      source-ref: ${{ needs.version.outputs.tag }}
      solution: FilerAI.Host.slnx
      working-directory: src/host
      test-filter: "FullyQualifiedName!~Live&FullyQualifiedName!~GPUStack"
      publish-project: src/host/src/FilerAI.Host/FilerAI.Host.csproj
      runtime: win-x64
      artifact-name: filer-host-win-x64
      with-plugin-runtime: true

  build-ai:
    name: Build filer-ai
    needs: version
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/build-dotnet.yml
    secrets: inherit
    with:
      source-ref: ${{ needs.version.outputs.tag }}
      solution: FilerAI.slnx
      working-directory: src/ai
      test-filter: "FullyQualifiedName!~Integration&FullyQualifiedName!~Live&FullyQualifiedName!~OopsInstaller&FullyQualifiedName!~InstallOops_BinaryAvailable"
      publish-project: src/ai/src/FilerAI.Cli/FilerAI.Cli.csproj
      runtime: win-x64
      artifact-name: filer-ai-win-x64

  build-launcher:
    name: Build Filer.Launcher
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          repository: iyulab/Filer
          token: ${{ secrets.RELEASE_TOKEN }}
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test src/launcher/tests/Filer.Launcher.Tests/ --verbosity normal

      - name: Publish
        run: dotnet publish src/launcher/Filer.Launcher.csproj -c Release -r win-x64 --self-contained -o publish/launcher

      - name: Sign launcher binary (must precede NSIS build)
        # Pinned to a specific commit SHA in iyulab/code-sign for supply-chain
        # safety; bump intentionally when the action is updated.
        uses: iyulab/code-sign@c4c68c25295ce0010a396d54cdb017fd248c5cce
        with:
          # The launcher is published with PublishSingleFile=true, so a single
          # self-contained Filer.Launcher.exe bundles all runtime libraries.
          files: ${{ github.workspace }}/publish/launcher/Filer.Launcher.exe

      - name: Install NSIS
        run: choco install nsis -y --no-progress
        shell: cmd

      - name: Build NSIS installer
        shell: bash
        env:
          UI_VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "Installer version (UI): $UI_VERSION"
          cp src/launcher/appsettings.json publish/launcher/ 2>/dev/null || true
          cp src/ui/build/icon.ico src/launcher/installer/
          WIN_PUBLISH_DIR="$(cd publish/launcher && pwd -W | sed 's|/|\\|g')"
          MSYS_NO_PATHCONV=1 "/c/Program Files (x86)/NSIS/makensis.exe" \
            /INPUTCHARSET UTF8 \
            /DVERSION=${UI_VERSION} \
            "/DPUBLISH_DIR=${WIN_PUBLISH_DIR}" \
            src/launcher/installer/launcher-installer.nsi
          mv src/launcher/installer/Filer-setup.exe publish/

      - name: Sign NSIS installer
        # Pinned to a specific commit SHA in iyulab/code-sign for supply-chain
        # safety; bump intentionally when the action is updated.
        uses: iyulab/code-sign@c4c68c25295ce0010a396d54cdb017fd248c5cce
        with:
          files: ${{ github.workspace }}/publish/Filer-setup.exe

      - uses: actions/upload-artifact@v7
        with:
          name: filer-launcher-win-x64
          path: publish/launcher/
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: filer-setup
          path: publish/Filer-setup.exe
          retention-days: 1

  build-ui:
    name: Build filer-ui (Windows)
    needs: version
    if: needs.version.outputs.released == 'true' && needs.version.outputs.ui_shell == 'electron'
    uses: ./.github/workflows/build-electron.yml
    with:
      source-ref: ${{ needs.version.outputs.tag }}
      os: windows-latest
      platform-flag: '--win'
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      AI_CONNECTION_STRING: ${{ secrets.AI_CONNECTION_STRING }}

  # The Tauri window as the ui slot (signed Filer.exe + filer-ui.json) -- the release's ui when scripts/ui-shell.txt says tauri.
  build-ui-tauri:
    name: Build filer-ui (Tauri, Windows)
    needs: version
    if: needs.version.outputs.released == 'true' && needs.version.outputs.ui_shell == 'tauri'
    uses: ./.github/workflows/build-tauri.yml
    with:
      source-ref: ${{ needs.version.outputs.tag }}
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  build-store-installer:
    name: Build offline installer (Microsoft Store)
    # Must run after ui/host/ai/launcher are built and signed: the offline payload embeds their
    # published output directly, so this cannot be folded into build-launcher.
    # One of the two ui jobs is always skipped (the tag's ui-shell.txt picks one); a skipped need would skip this job too.
    needs: [version, build-ui, build-ui-tauri, build-host, build-ai, build-launcher]
    if: >-
      needs.version.outputs.released == 'true' && !cancelled() && !contains(needs.*.result, 'failure') &&
      (needs.build-ui.result == 'success' || needs.build-ui-tauri.result == 'success')
    runs-on: windows-latest
    # Signing uses an OIDC federated credential, which requires the 'production' environment.
    # No job-level `permissions:` block: release.yml already grants id-token: write at the
    # workflow level, and the sibling build-launcher job relies on that same grant. Do not copy
    # the per-job permissions pattern from build-electron.yml/build-dotnet.yml — those are
    # reusable workflow_call files and declare their own.
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          repository: iyulab/Filer
          token: ${{ secrets.RELEASE_TOKEN }}
          ref: ${{ needs.version.outputs.tag }}

      - name: Download component artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # The runtime layer is NOT rebuilt here. It comes from the pinned artifact that
      # pin-ui-runtime.yml built and signed once, so the web manifest and this installer seed
      # ship the same bytes rather than two independently produced trees with two chances to
      # diverge. src/ui/electron-runtime.lock.json is the single source for where it lives.
      - name: Read the pinned runtime lock
        id: lock
        if: needs.version.outputs.ui_shell == 'electron'
        shell: pwsh
        run: |
          $lock = Get-Content src/ui/electron-runtime.lock.json -Raw | ConvertFrom-Json
          # Hard-fail rather than emit a half-formed seed. The lock is updated by a manual,
          # cross-repo owner paste that can lag a release tag reaching CI; a seed built against
          # an incomplete lock would be missing its entire runtime layer and would not be
          # runnable, while still looking like a successful build.
          foreach ($f in 'runtimeId', 'sha256', 'url', 'size') {
            if ([string]::IsNullOrWhiteSpace([string]$lock.$f)) {
              throw "electron-runtime.lock.json is missing '$f' -- run pin-ui-runtime.yml and paste its four values before releasing"
            }
          }
          "id=$($lock.runtimeId)"   | Out-File $env:GITHUB_OUTPUT -Append
          "sha=$($lock.sha256)"     | Out-File $env:GITHUB_OUTPUT -Append
          "url=$($lock.url)"        | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Pinned runtime $($lock.runtimeId) (electron $($lock.electronVersion))"

      - name: Fetch and verify the pinned runtime layer
        if: needs.version.outputs.ui_shell == 'electron'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/ui-runtime.zip"
          Invoke-WebRequest -Uri "${{ steps.lock.outputs.url }}" -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          # The lock's hash is the whole reason this asset can be trusted without rebuilding it.
          # Checking it here means a swapped or truncated asset fails the release instead of
          # being sealed into an installer that is then submitted to the Store, where 10.2.9
          # guarantees it will never be updated.
          if ($actual -ne "${{ steps.lock.outputs.sha }}".ToLower()) {
            throw "runtime zip sha256 mismatch`n  expected ${{ steps.lock.outputs.sha }}`n  actual   $actual"
          }
          Expand-Archive $zip -DestinationPath ui-runtime -Force
          if (-not (Test-Path ui-runtime/Filer.exe)) { throw "pinned runtime has no Filer.exe" }
          if (Test-Path ui-runtime/resources/app.asar) { throw "pinned runtime contains an app layer" }

      # release.yml publishes one monolithic ui artifact for as long as the runtime-pin handoff's
      # section 2 deprecation window is open, so the app layer is carved out here. The split is
      # exactly: app layer = resources/app.asar at that path, and nothing else.
      - name: Carve the app layer
        if: needs.version.outputs.ui_shell == 'electron'
        shell: pwsh
        run: |
          $src = 'artifacts/electron-dist-win/resources/app.asar'
          if (-not (Test-Path $src)) { throw "no app.asar in artifacts/electron-dist-win" }
          New-Item -ItemType Directory -Force ui-app/resources | Out-Null
          Copy-Item $src ui-app/resources/app.asar
          # Nothing else is copied on purpose: any extra file here would be seeded into the slot
          # and then survive composition, since UiComposer only adds and overwrites, never prunes.

      # SHELL-TAURI T5: while src/host/node-runtime.lock.json exists the release names the Node runtime layer for the host,
      # so the seed carries that layer too (verified against the lock, as the Electron layer is) — an offline install then
      # runs the host's plugin runtime on it from its first start, as an updated one does.
      - name: Fetch and verify the Node runtime layer
        id: nodelock
        shell: pwsh
        run: |
          if (-not (Test-Path src/host/node-runtime.lock.json)) { "args=" | Out-File $env:GITHUB_OUTPUT -Append; return }
          $lock = Get-Content src/host/node-runtime.lock.json -Raw | ConvertFrom-Json
          foreach ($f in 'runtimeId', 'sha256', 'url', 'size') {
            if ([string]::IsNullOrWhiteSpace([string]$lock.$f)) { throw "node-runtime.lock.json is missing '$f'" }
          }
          $zip = "$env:RUNNER_TEMP/node-runtime.zip"
          Invoke-WebRequest -Uri $lock.url -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $lock.sha256.ToLower()) { throw "node runtime zip sha256 mismatch`n  expected $($lock.sha256)`n  actual   $actual" }
          Expand-Archive $zip -DestinationPath node-runtime -Force
          if (-not (Test-Path node-runtime/node.exe)) { throw "pinned Node runtime has no node.exe" }
          "args=-NodeRuntimeSource node-runtime -NodeRuntimeId $($lock.runtimeId)" | Out-File $env:GITHUB_OUTPUT -Append

      # Both -UiSource and -UiRuntimeSource accept a plain directory (Expand-Source), so the
      # carved trees and the expanded runtime go straight through with no re-zipping. A Tauri slot is complete on its own
      # (filer-ui.json): no runtime layer, no carve. WebView2 is not bundled -- the launcher refuses a slot on a machine
      # without it and keeps the ui that runs.
      - name: Assemble seed payload
        shell: pwsh
        env:
          UI_SHELL: ${{ needs.version.outputs.ui_shell }}
          UI_VERSION: ${{ needs.version.outputs.version }}
          HOST_VERSION: ${{ needs.version.outputs.host_version }}
          AI_VERSION: ${{ needs.version.outputs.ai_version }}
          LAUNCHER_VERSION: ${{ needs.version.outputs.launcher_version }}
        run: |
          $ui = if ($env:UI_SHELL -eq 'tauri') { @('-UiSource', 'artifacts/filer-ui-tauri-win-x64') }
                else { @('-UiSource', 'ui-app', '-UiRuntimeSource', 'ui-runtime', '-UiRuntimeId', '${{ steps.lock.outputs.id }}') }
          pwsh -File scripts/build-offline-payload.ps1 @ui `
            -HostSource artifacts/filer-host-win-x64 `
            -AiSource artifacts/filer-ai-win-x64 `
            -UiVersion "$env:UI_VERSION" `
            -HostVersion "$env:HOST_VERSION" `
            -AiVersion "$env:AI_VERSION" `
            -LauncherVersion "$env:LAUNCHER_VERSION" `
            -OutDir payload ${{ steps.nodelock.outputs.args }}

      - name: Install NSIS
        run: choco install nsis -y --no-progress
        shell: cmd

      - name: Build offline installer
        shell: pwsh
        env:
          UI_VERSION: ${{ needs.version.outputs.version }}
        run: |
          Copy-Item src/ui/build/icon.ico src/launcher/installer/ -Force
          $launcher = (Resolve-Path artifacts/filer-launcher-win-x64).Path
          $payload  = (Resolve-Path payload).Path
          & "C:\Program Files (x86)\NSIS\makensis.exe" /INPUTCHARSET UTF8 `
            "/DVERSION=$env:UI_VERSION" `
            "/DPUBLISH_DIR=$launcher" "/DOFFLINE_PAYLOAD_DIR=$payload" /DSILENT_UI `
            src/launcher/installer/launcher-installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Force publish | Out-Null
          Move-Item src/launcher/installer/Filer-setup.exe publish/Filer-setup-offline.exe

      - name: Sign offline installer
        # Pinned to a commit SHA for supply-chain safety; bump intentionally.
        uses: iyulab/code-sign@c4c68c25295ce0010a396d54cdb017fd248c5cce
        with:
          files: ${{ github.workspace }}/publish/Filer-setup-offline.exe

      # Deliberately ahead of the publish step rather than after it. This is the only way to
      # retrieve the binary by hand if publishing fails, so it has to run before the step it
      # insures against -- otherwise a throw there takes the whole job's signed output with it.
      - uses: actions/upload-artifact@v7
        with:
          name: filer-setup-offline
          path: publish/Filer-setup-offline.exe
          retention-days: 1

      # Pinned rather than taken from the runner image: this step gates a release, and the
      # image's Python moves without notice.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The Store's EXE/MSI path requires a versioned HTTPS URL that does not redirect
      # (policy 10.2.9 #3/#4). Release asset URLs answer with a 302 to a signed, expiring
      # location, so the submitted URL has to point somewhere else. This publishes the same
      # signed binary that was just built, under a version-pinned key.
      - name: Publish offline installer to object storage
        id: store_url
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOWNLOAD_HOST: ${{ vars.STORE_DOWNLOAD_HOST }}
          UI_VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Skipping keeps the release green while the download host is still being set up.
          # Once the four values are present, a failure here is a release failure by design:
          # a release whose Store URL is missing or wrong is worse than one that stops.
          foreach ($name in 'AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY', 'ACCOUNT_ID', 'DOWNLOAD_HOST') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              Write-Warning "$name is not set -- skipping. No Store package URL for this release."
              "published=false" | Out-File $env:GITHUB_OUTPUT -Append
              exit 0
            }
          }

          $file = 'publish/Filer-setup-offline.exe'
          $expected = (Get-Item $file).Length
          $key = "$env:UI_VERSION/Filer-setup-offline.exe"

          # Version-pinned on purpose: an unpinned install would let whatever was published
          # upstream that morning into a release-gating step. Bump intentionally.
          python -m pip install --quiet --disable-pip-version-check 'boto3==1.43.62'
          if ($LASTEXITCODE -ne 0) { throw "boto3 install failed" }

          # Uploads in parts, then reads the object back and hashes it. wrangler cannot be
          # used here: it refuses anything over 300 MiB and this installer is larger.
          python scripts/publish-store-installer.py $file 'filer-downloads' $key
          if ($LASTEXITCODE -ne 0) { throw "publishing the installer failed with exit code $LASTEXITCODE" }

          $url = "https://$env:DOWNLOAD_HOST/$key"

          # Redirect check, on its own. PowerShell 7 throws HttpResponseException on a 3xx
          # when redirects are disabled, so the status has to be read off the exception.
          # Retrying that like a transport failure would report a connectivity problem for
          # the one defect this gate exists to catch.
          $head = $null
          foreach ($attempt in 1..5) {
            try {
              $head = Invoke-WebRequest -Uri $url -Method Head -MaximumRedirection 0 -ErrorAction Stop
              break
            } catch {
              $status = $_.Exception.Response.StatusCode.value__
              if ($status -ge 300 -and $status -lt 400) {
                throw "$url answers HTTP $status -- a package URL that redirects is rejected at submission. Serve the object directly from the custom domain."
              }
              if ($attempt -eq 5) { throw "HEAD $url failed after 5 attempts: $($_.Exception.Message)" }
              Write-Host "attempt $attempt -- $($_.Exception.Message)"
              Start-Sleep -Seconds ($attempt * 5)
            }
          }

          # Content-Length is not guaranteed on a HEAD, so fall back to a one-byte ranged
          # GET, whose Content-Range carries the total.
          $len = $head.Headers['Content-Length']
          if ($len) {
            $served = [int64]($len | Select-Object -First 1)
          } else {
            $tail = Invoke-WebRequest -Uri $url -Headers @{ Range = 'bytes=-1' } -MaximumRedirection 0 -ErrorAction Stop
            $range = $tail.Headers['Content-Range'] | Select-Object -First 1
            if ($range -notmatch '/(\d+)$') {
              throw "cannot determine the published size: neither Content-Length nor Content-Range came back"
            }
            $served = [int64]$Matches[1]
          }

          if ($served -ne $expected) {
            throw "the public URL serves $served bytes, expected $expected"
          }

          Write-Host "Store package URL: $url ($served bytes)"
          "published=true" | Out-File $env:GITHUB_OUTPUT -Append
          "url=$url"       | Out-File $env:GITHUB_OUTPUT -Append
          "Store package URL: ``$url``" | Out-File $env:GITHUB_STEP_SUMMARY -Append

  smoke-post-update:
    name: Post-update smoke (packaged)
    # The one gate that runs the path an update actually takes: install the previous public
    # release, let it bootstrap, install this candidate's launcher over it, update to the candidate
    # set over the launcher pipe, and require the new UI to report ready with nothing rolled back —
    # then, as the positive control, offer a ui that cannot start and require the launcher to roll
    # it back. Every other gate runs unpackaged; the v0.5.1/v0.5.2 brick (a UI that quit on its
    # first start after an update) passed all of them. Script and evidence rules live in
    # iyulab/Filer: scripts/ci/post-update-smoke.ps1.
    needs: [version, build-ui, build-ui-tauri, build-host, build-ai, build-launcher]
    if: >-
      needs.version.outputs.released == 'true' && !cancelled() && !contains(needs.*.result, 'failure') &&
      (needs.build-ui.result == 'success' || needs.build-ui-tauri.result == 'success')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: iyulab/Filer
          token: ${{ secrets.RELEASE_TOKEN }}
          ref: ${{ needs.version.outputs.tag }}

      - name: Download component artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # The ui test double (built only when the release names the Node runtime layer — see the next step) targets .NET 10.
      - uses: actions/setup-dotnet@v5
        if: hashFiles('src/host/node-runtime.lock.json') != ''
        with:
          dotnet-version: '10.0.x'

      - name: Run the packaged post-update smoke
        shell: pwsh
        env:
          UI_VERSION: ${{ needs.version.outputs.version }}
          HOST_VERSION: ${{ needs.version.outputs.host_version }}
          AI_VERSION: ${{ needs.version.outputs.ai_version }}
          LAUNCHER_VERSION: ${{ needs.version.outputs.launcher_version }}
          UI_SHELL: ${{ needs.version.outputs.ui_shell }}
        run: |
          # SHELL-TAURI T5: once src/host/node-runtime.lock.json exists the release names the Node runtime layer (publish below),
          # so the smoke offers that same layer — fetched from the lock's URL and checked against its sha256 — and asserts the
          # plugin runtime runs on it and that leaving it rolls back to the Electron one. Without the lock: the Electron-only set.
          $nodeArgs = @()
          if (Test-Path 'src/host/node-runtime.lock.json') {
            $lock = Get-Content 'src/host/node-runtime.lock.json' -Raw | ConvertFrom-Json
            $layerZip = Join-Path $env:RUNNER_TEMP 'node-runtime.zip'
            Invoke-WebRequest $lock.url -OutFile $layerZip
            $sha = (Get-FileHash $layerZip -Algorithm SHA256).Hash.ToLower()
            if ($sha -ne $lock.sha256) { throw "the Node runtime layer at $($lock.url) is $sha, the lock says $($lock.sha256)" }
            if ($sha.Substring(0, 12) -ne $lock.runtimeId) { throw "the lock's runtimeId $($lock.runtimeId) is not its zip's id $($sha.Substring(0, 12))" }
            # Phase E's crashing host is the ui test double in its fail mode (and Phase D runs with it too).
            dotnet publish scripts/ci/ui-double/UiDouble.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:PublishTrimmed=true -o ui-double
            if ($LASTEXITCODE -ne 0) { throw 'ui double publish failed' }
            $nodeArgs = @('-NodeLayerZip', $layerZip, '-UiDoubleDir', (Resolve-Path 'ui-double').Path)
            Write-Host "Node runtime layer $($lock.runtimeId) in the smoke"
          }
          # The swap release's candidate ui is the Tauri slot: the smoke's update phase is then Electron -> Tauri. Passed only for
          # tauri, so a re-run of a tag whose smoke predates the parameter still runs.
          $candidateArgs = if ($env:UI_SHELL -eq 'tauri') { @('-CandidateUi', 'tauri') } else { @() }
          pwsh -NoProfile -File scripts/ci/post-update-smoke.ps1 `
            -ArtifactsDir artifacts `
            -UiVersion "$env:UI_VERSION" `
            -HostVersion "$env:HOST_VERSION" `
            -AiVersion "$env:AI_VERSION" `
            -LauncherVersion "$env:LAUNCHER_VERSION" @nodeArgs @candidateArgs
          if ($LASTEXITCODE -ne 0) { throw "post-update smoke failed with exit code $LASTEXITCODE" }

      - name: Keep the launcher and UI logs when the smoke fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: post-update-smoke-logs
          path: |
            ~/.filer/logs/
            ~/.filer/components.json
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: Publish release
    # All build-* jobs already sign their binaries via the iyulab/code-sign
    # composite action, so this job only needs to package and publish.
    needs: [version, changelog, build-ui, build-ui-tauri, build-host, build-ai, build-launcher, smoke-post-update]
    if: >-
      needs.version.outputs.released == 'true' && !cancelled() && !contains(needs.*.result, 'failure') &&
      (needs.build-ui.result == 'success' || needs.build-ui-tauri.result == 'success') &&
      needs.smoke-post-update.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: iyulab/Filer
          token: ${{ secrets.RELEASE_TOKEN }}
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release artifacts
        shell: bash
        env:
          UI_VERSION: ${{ needs.version.outputs.version }}
          HOST_VERSION: ${{ needs.version.outputs.host_version }}
          AI_VERSION: ${{ needs.version.outputs.ai_version }}
          LAUNCHER_VERSION: ${{ needs.version.outputs.launcher_version }}
          TAG: ${{ needs.version.outputs.tag }}
          UI_SHELL: ${{ needs.version.outputs.ui_shell }}
        run: |
          mkdir -p release-artifacts
          cp artifacts/filer-setup/Filer-setup.exe release-artifacts/

          # The ui zip is whichever window the tag releases; its name stays, so every launcher reads it the same way.
          if [ "${UI_SHELL}" = tauri ]; then UI_DIR=artifacts/filer-ui-tauri-win-x64; else UI_DIR=artifacts/electron-dist-win; fi
          (cd "${UI_DIR}" && zip -r "${GITHUB_WORKSPACE}/release-artifacts/filer-ui-win-x64.zip" .)
          # SHELL-TAURI T5: the host carries the plugin runtime; a host zip without it would leave a Node-layer install with no
          # plugins (the launcher falls back to the Electron ui's copy only while one is installed).
          test -f artifacts/filer-host-win-x64/plugin-runtime/plugin-sidecar.js || { echo "host artifact carries no plugin-runtime/plugin-sidecar.js"; exit 1; }
          cd artifacts/filer-host-win-x64 && zip -r ../../release-artifacts/filer-host-win-x64.zip . && cd ../..
          cd artifacts/filer-ai-win-x64 && zip -r ../../release-artifacts/filer-ai-win-x64.zip . && cd ../..
          cd artifacts/filer-launcher-win-x64 && zip -r ../../release-artifacts/filer-launcher-win-x64.zip . && cd ../..

          cd release-artifacts
          UI_SHA=$(sha256sum filer-ui-win-x64.zip | cut -d' ' -f1)
          UI_SIZE=$(stat -c%s filer-ui-win-x64.zip)
          HOST_SHA=$(sha256sum filer-host-win-x64.zip | cut -d' ' -f1)
          HOST_SIZE=$(stat -c%s filer-host-win-x64.zip)
          AI_SHA=$(sha256sum filer-ai-win-x64.zip | cut -d' ' -f1)
          AI_SIZE=$(stat -c%s filer-ai-win-x64.zip)
          LAUNCHER_SHA=$(sha256sum filer-launcher-win-x64.zip | cut -d' ' -f1)
          LAUNCHER_SIZE=$(stat -c%s filer-launcher-win-x64.zip)

          BASE_URL="https://github.com/iyulab/Filer-releases/releases/download/${TAG}"

          # Manifest protocols: the full set is published as the file the current launcher reads (latest-v2.json,
          # manifestVersion 2). Every older protocol's file carries ONLY the current launcher, so an older launcher updates
          # itself first and never applies a set it predates (an older launcher replaces the backend in place under a running
          # window, and a backend that requires a credential the older window cannot present refuses every call it makes).
          # When the protocol goes up: publish the new file and move the previous one into RETIRED.
          node -e "
          const PROTOCOL = 2;
          const RETIRED = [{ file: 'latest.json', manifestVersion: 1 }];
          // SHELL-TAURI T5: the host names the Node runtime layer its plugin sidecar runs on only while src/host/node-runtime.lock.json
          // exists (pin-node-runtime.yml prints it); a launcher on that layer runs the host's plugin-runtime/ on it, every other
          // install keeps the Electron ui's copy.
          const fs = require('fs');
          const lockPath = require('path').join(process.env.GITHUB_WORKSPACE, 'src/host/node-runtime.lock.json'); // this step runs inside release-artifacts/
          const nodeLock = fs.existsSync(lockPath) ? JSON.parse(fs.readFileSync(lockPath, 'utf8')) : null;
          const nodeLayer = nodeLock && { version: nodeLock.runtimeId, artifacts: { 'win-x64': { url: nodeLock.url, sha256: nodeLock.sha256, size: nodeLock.size } } };
          const m = {
            manifestVersion: PROTOCOL,
            launcher: {
              version: '${LAUNCHER_VERSION}',
              artifacts: { 'win-x64': { url: '${BASE_URL}/filer-launcher-win-x64.zip', sha256: '${LAUNCHER_SHA}', size: ${LAUNCHER_SIZE} } }
            },
            ui: {
              version: '${UI_VERSION}', minHost: '${HOST_VERSION}', minAi: '${AI_VERSION}',
              artifacts: { 'win-x64': { url: '${BASE_URL}/filer-ui-win-x64.zip', sha256: '${UI_SHA}', size: ${UI_SIZE} } }
            },
            host: {
              version: '${HOST_VERSION}',
              ...(nodeLayer ? { runtime: 'node' } : {}),
              artifacts: { 'win-x64': { url: '${BASE_URL}/filer-host-win-x64.zip', sha256: '${HOST_SHA}', size: ${HOST_SIZE} } }
            },
            ai: {
              version: '${AI_VERSION}',
              artifacts: { 'win-x64': { url: '${BASE_URL}/filer-ai-win-x64.zip', sha256: '${AI_SHA}', size: ${AI_SIZE} } }
            },
            ...(nodeLayer ? { runtimes: { node: nodeLayer } } : {})
          };
          fs.writeFileSync('latest-v' + PROTOCOL + '.json', JSON.stringify(m, null, 2));
          for (const r of RETIRED) {
            fs.writeFileSync(r.file, JSON.stringify({ manifestVersion: r.manifestVersion, launcher: m.launcher }, null, 2));
          }
          "

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ needs.version.outputs.tag }}
          name: >-
            Filer ${{ needs.version.outputs.tag }}
            (host ${{ needs.version.outputs.host_version }},
            ai ${{ needs.version.outputs.ai_version }},
            launcher ${{ needs.version.outputs.launcher_version }})
          body: ${{ needs.changelog.outputs.body }}
          files: release-artifacts/*
          # Filer's release is always «Latest»: installs read releases/latest/download/latest-v2.json, so no other release
          # in this repository (the runtime stores) may hold that mark.
          make_latest: true

      # Every artifact the build jobs upload, once the release carries them. filer-setup-offline was missing
      # from this list from the day it was added (8f555d8), so each published release left a ~360 MB copy for a
      # day. Runs that fail before this step keep their artifacts on purpose: "Re-run failed jobs" downloads
      # them again instead of rebuilding and re-signing everything, and retention-days: 1 bounds what they cost.
      - name: Delete all intermediate artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            electron-dist-win
            filer-ui-tauri-win-x64
            filer-host-win-x64
            filer-ai-win-x64
            filer-launcher-win-x64
            filer-setup
            filer-setup-offline
