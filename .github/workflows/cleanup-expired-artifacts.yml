name: Cleanup Storage

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup-artifacts:
    name: Delete old artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts older than 2 days
        uses: actions/github-script@v7
        with:
          script: |
            const maxAgeDays = 2;
            const cutoff = Date.now() - maxAgeDays * 86400000;
            let totalDeleted = 0;
            let totalFreedBytes = 0;

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );

            const old = artifacts.filter(a =>
              a.expired || new Date(a.created_at).getTime() < cutoff
            );

            if (old.length === 0) {
              core.info('No artifacts to clean up');
              return;
            }

            core.info(`Found ${old.length} artifacts to delete`);
            for (const artifact of old) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                totalDeleted++;
                totalFreedBytes += artifact.size_in_bytes;
              } catch (err) {
                core.warning(`Failed to delete ${artifact.name}: ${err.message}`);
              }
            }
            core.info(`Deleted ${totalDeleted} artifacts, freed ${(totalFreedBytes / 1048576).toFixed(1)} MB`);

  cleanup-caches:
    name: Delete stale caches
    runs-on: ubuntu-latest
    steps:
      - name: Delete caches from closed/merged branches
        uses: actions/github-script@v7
        with:
          script: |
            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );

            // Keep caches for default branch, delete the rest
            const defaultBranch = 'main';
            const stale = caches.filter(c => c.ref !== `refs/heads/${defaultBranch}`);

            let totalDeleted = 0;
            let totalFreedBytes = 0;

            if (stale.length === 0) {
              core.info('No stale caches found');
              return;
            }

            core.info(`Found ${stale.length} stale caches from non-default branches`);
            for (const cache of stale) {
              try {
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                });
                totalDeleted++;
                totalFreedBytes += cache.size_in_bytes;
              } catch (err) {
                core.warning(`Failed to delete cache ${cache.key}: ${err.message}`);
              }
            }
            core.info(`Deleted ${totalDeleted} caches, freed ${(totalFreedBytes / 1048576).toFixed(1)} MB`);
