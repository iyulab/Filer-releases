name: Diagnose host test foreground threads

# Manual only. The Release workflow's Windows host test run ends with xunit.v3's "Foreground threads were left running" after
# every test passed; it does not reproduce on a developer machine, and neither the telemetry tests nor everything else
# reproduces it alone. This runs FilerAI.Mcp.Tests on the same runner image in slices to find which combination does.
# Nothing here builds a release, signs or publishes anything.

on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: 'iyulab/Filer ref to test (blank = default branch)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  slice:
    name: ${{ matrix.mode }} rep ${{ matrix.rep }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [as-release, one-assembly-at-a-time]
        rep: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6
        with:
          repository: iyulab/Filer
          token: ${{ secrets.RELEASE_TOKEN }}
          ref: ${{ inputs.source-ref || '' }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        working-directory: src/host
        run: dotnet build FilerAI.Host.slnx

      - name: Test the whole solution
        id: test
        continue-on-error: true
        working-directory: src/host
        shell: bash
        run: |
          extra=""
          if [ "${{ matrix.mode }}" = "one-assembly-at-a-time" ]; then extra="--max-parallel-test-modules 1"; fi
          dotnet test FilerAI.Host.slnx --no-build --filter "FullyQualifiedName!~Live&FullyQualifiedName!~GPUStack" $extra

      - name: Verdict
        shell: pwsh
        run: |
          "RESULT mode=${{ matrix.mode }} rep=${{ matrix.rep }} test=${{ steps.test.outcome }}"
