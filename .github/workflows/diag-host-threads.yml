name: Diagnose host test foreground threads

# Manual only. The Release workflow's Windows host test run ends with xunit.v3's "Foreground threads were left running" after
# every test passed; it does not reproduce on a developer machine, and neither the telemetry tests nor everything else
# reproduces it alone. This runs FilerAI.Mcp.Tests on the same runner image in slices to find which combination does.
# Nothing here builds a release, signs or publishes anything.

on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: 'iyulab/Filer ref to test (blank = default branch)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  slice:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: full run, unchanged (control)
            filter: 'FullyQualifiedName!~Live&FullyQualifiedName!~GPUStack'
            otel: ''
          - name: full run, OpenTelemetry SDK disabled
            filter: 'FullyQualifiedName!~Live&FullyQualifiedName!~GPUStack'
            otel: 'true'
          - name: full run without the Application Insights writer tests
            filter: 'FullyQualifiedName!~Live&FullyQualifiedName!~GPUStack&FullyQualifiedName!~AppInsightsEnvelopeTests'
            otel: ''
    steps:
      - uses: actions/checkout@v6
        with:
          repository: iyulab/Filer
          token: ${{ secrets.RELEASE_TOKEN }}
          ref: ${{ inputs.source-ref || '' }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        working-directory: src/host
        run: dotnet build FilerAI.Host.slnx

      - name: Test
        working-directory: src/host
        env:
          OTEL_SDK_DISABLED: ${{ matrix.otel }}
        run: dotnet test tests/FilerAI.Mcp.Tests/FilerAI.Mcp.Tests.csproj --no-build --filter "${{ matrix.filter }}"
