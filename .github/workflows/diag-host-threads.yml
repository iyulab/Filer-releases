name: Diagnose host test foreground threads

# Manual only. The Release workflow's Windows host test run ends with xunit.v3's "Foreground threads were left running"
# after every test passed; it does not reproduce on a developer machine. This runs FilerAI.Mcp.Tests alone on the same
# runner image and takes managed stack snapshots of the test process until it exits, so the thread that outlives the tests
# is named. Nothing here builds, signs or publishes anything.

on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: 'iyulab/Filer ref to test (blank = default branch)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  diagnose:
    name: Stacks of the test host
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          repository: iyulab/Filer
          token: ${{ secrets.RELEASE_TOKEN }}
          ref: ${{ inputs.source-ref || '' }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        working-directory: src/host
        run: dotnet build FilerAI.Host.slnx

      - name: Telemetry tests alone
        id: telemetry
        continue-on-error: true
        working-directory: src/host
        run: dotnet test tests/FilerAI.Mcp.Tests/FilerAI.Mcp.Tests.csproj --no-build --filter "FullyQualifiedName~Telemetry&FullyQualifiedName!~Live&FullyQualifiedName!~GPUStack"

      - name: Everything except telemetry tests
        id: rest
        continue-on-error: true
        working-directory: src/host
        run: dotnet test tests/FilerAI.Mcp.Tests/FilerAI.Mcp.Tests.csproj --no-build --filter "FullyQualifiedName!~Telemetry&FullyQualifiedName!~Live&FullyQualifiedName!~GPUStack"

      - name: Verdict
        shell: pwsh
        run: |
          "telemetry tests alone : ${{ steps.telemetry.outcome }}"
          "everything but them   : ${{ steps.rest.outcome }}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: host-thread-diagnosis
          path: ${{ runner.temp }}/diag
          if-no-files-found: ignore
          retention-days: 3
          include-hidden-files: true
