name: Diagnose host test foreground threads

# Manual only. The Release workflow's Windows host test run ends with xunit.v3's "Foreground threads were left running" after
# every test passed; it does not reproduce on a developer machine, and neither the telemetry tests nor everything else
# reproduces it alone. This runs FilerAI.Mcp.Tests on the same runner image in slices to find which combination does.
# Nothing here builds a release, signs or publishes anything.

on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: 'iyulab/Filer ref to test (blank = default branch)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  slice:
    name: otel=${{ matrix.otel || 'on' }} rep ${{ matrix.rep }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        otel: ['', 'true']
        rep: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
        with:
          repository: iyulab/Filer
          token: ${{ secrets.RELEASE_TOKEN }}
          ref: ${{ inputs.source-ref || '' }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        working-directory: src/host
        run: dotnet build FilerAI.Host.slnx

      - name: Test, first run
        id: first
        continue-on-error: true
        working-directory: src/host
        env:
          OTEL_SDK_DISABLED: ${{ matrix.otel }}
        run: dotnet test tests/FilerAI.Mcp.Tests/FilerAI.Mcp.Tests.csproj --no-build --filter "FullyQualifiedName!~Live&FullyQualifiedName!~GPUStack"

      - name: Test, second run
        id: second
        continue-on-error: true
        working-directory: src/host
        env:
          OTEL_SDK_DISABLED: ${{ matrix.otel }}
        run: dotnet test tests/FilerAI.Mcp.Tests/FilerAI.Mcp.Tests.csproj --no-build --filter "FullyQualifiedName!~Live&FullyQualifiedName!~GPUStack"

      - name: Verdict
        shell: pwsh
        run: |
          "RESULT otel=${{ matrix.otel || 'on' }} rep=${{ matrix.rep }} first=${{ steps.first.outcome }} second=${{ steps.second.outcome }}"
