name: .NET Build

on:
  workflow_call:
    inputs:
      solution:
        required: true
        type: string
      working-directory:
        required: true
        type: string
      test-filter:
        required: true
        type: string
      publish-project:
        required: false
        type: string
        default: ''
      runtime:
        required: false
        type: string
        default: ''
      artifact-name:
        required: false
        type: string
        default: ''
      source-ref:
        required: false
        type: string
        default: ''
      # The host component carries the plugin runtime (the sidecar + its child, built for plain Node into src/ui/out/plugin-runtime)
      # at plugin-runtime/ — the path the launcher runs on the Node runtime layer.
      with-plugin-runtime:
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: >-
      ${{
        inputs.runtime == 'osx-arm64' && 'macos-latest' ||
        inputs.runtime == 'win-x64' && 'windows-latest' ||
        'ubuntu-latest'
      }}
    # Signing path uses OIDC federated credential, which requires the
    # job to run in the 'production' environment. Non-signing runs use
    # this environment harmlessly (no protection rules configured).
    environment: ${{ inputs.runtime == 'win-x64' && inputs.publish-project != '' && 'production' || '' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: iyulab/Filer
          token: ${{ secrets.RELEASE_TOKEN }}
          ref: ${{ inputs.source-ref || '' }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ inputs.solution }}

      - name: Build
        run: dotnet build ${{ inputs.solution }} --no-restore

      # xunit's exit watchdog: a test process that passed every test can
      # still end with «[FATAL ERROR] Foreground threads were left running, forcing process exit» — ~1 run in 6, cause not found
      # yet. Exactly that case passes with a warning: every assembly's summary says failed: 0 and the watchdog line is the only
      # fatal line. Anything else fails as before. Remove this when the thread is found.
      - name: Test
        shell: bash
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/dotnet-test.log"
          args=(test "${{ inputs.solution }}" --no-build)
          if [ -n "$TEST_FILTER" ]; then args+=(--filter "$TEST_FILTER"); fi
          set +e
          dotnet "${args[@]}" 2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          set -e
          [ "$code" -eq 0 ] && exit 0
          watchdog='Foreground threads were left running, forcing process exit'
          fatal=$(grep -c '\[FATAL ERROR\]' "$log" || true)
          fatal_watchdog=$(grep -c "\[FATAL ERROR\] $watchdog" "$log" || true)
          failed_nonzero=$(grep -Eic 'failed: *[1-9]' "$log" || true)
          summaries=$(grep -Eic 'failed: *[0-9]+' "$log" || true)
          if [ "$fatal_watchdog" -ge 1 ] && [ "$fatal" -eq "$fatal_watchdog" ] && [ "$failed_nonzero" -eq 0 ] && [ "$summaries" -ge 1 ]; then
            echo "::warning::dotnet test exited $code only through xunit's exit watchdog ($fatal_watchdog assembly/ies; every test passed)"
            exit 0
          fi
          exit "$code"

      # Hermeticity guard (Filer ISSUE-filer-20260717-0010): tests must never touch
      # the real user profile's Filer home. CI runners start with no ~/.filer, so ANY
      # file appearing there after the test run is proof of a leak (a suite booting
      # host code without FILER_HOME/FILER_SKIP_UI_CONFIG redirection).
      - name: Assert tests did not write $HOME/.filer
        shell: bash
        run: |
          if [ -d "$HOME/.filer" ]; then
            echo "::error::Tests created $HOME/.filer — a test suite is writing the real user profile (ISSUE-0010 class). Contents:"
            find "$HOME/.filer" -maxdepth 3 | head -50
            exit 1
          fi
          echo "hermeticity OK — no \$HOME/.filer created"

      - name: Publish
        if: inputs.publish-project != ''
        # The projects own their publish shape (ReadyToRun, not compressed) in their .csproj — a -p here would override it.
        # filer-host is the Application Insights emitter: it stamps the connection string into its assembly from the
        # FilerTelemetryConnectionString property (a project that does not declare it ignores it). MSBuild reads ';' in a -p
        # value as the next property, so the string's separators travel escaped as %3B — unescaped, only the
        # InstrumentationKey part is stamped. The escaped form is masked like the secret itself.
        shell: bash
        env:
          AI_CONN: ${{ secrets.AI_CONNECTION_STRING }}
        run: |
          set -e
          extra=()
          if [ -n "$AI_CONN" ]; then
            escaped="${AI_CONN//;/%3B}"
            echo "::add-mask::$escaped"
            extra+=("-p:FilerTelemetryConnectionString=$escaped")
          fi
          dotnet publish "${{ inputs.publish-project }}" \
            -c Release \
            -r ${{ inputs.runtime }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o publish-output \
            "${extra[@]}"
        working-directory: .

      - uses: actions/setup-node@v6
        if: inputs.with-plugin-runtime
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Build the plugin runtime into the publish output
        if: inputs.with-plugin-runtime
        shell: bash
        working-directory: src/ui
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          set -e
          npm ci
          npm run build:plugin-runtime
          rm -rf ../../publish-output/plugin-runtime
          cp -r out/plugin-runtime ../../publish-output/plugin-runtime
          test -f ../../publish-output/plugin-runtime/plugin-sidecar.js
          test -f ../../publish-output/plugin-runtime/plugin-child.js

      - name: Sign published executable
        if: inputs.publish-project != '' && inputs.runtime == 'win-x64'
        # Pinned to a specific commit SHA in iyulab/code-sign for supply-chain
        # safety; bump intentionally when the action is updated.
        uses: iyulab/code-sign@c4c68c25295ce0010a396d54cdb017fd248c5cce
        with:
          # publish-output lives at repo root because the Publish step
          # runs with working-directory: '.'; use absolute path since
          # composite-action uses: steps inherit the job-level working-directory.
          files: ${{ github.workspace }}/publish-output/*.exe

      # The launcher checks every file of this component against a signed catalog at its root (filer-component.cat, written by
      # the app repository's scripts/ci/write-component-catalog.ps1 and signed here like the programs). A tag from before the
      # script releases without one, as it did.
      - name: Write the component catalog
        if: inputs.publish-project != '' && inputs.runtime == 'win-x64'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: if (Test-Path scripts/ci/write-component-catalog.ps1) { ./scripts/ci/write-component-catalog.ps1 -Dir 'publish-output' }

      - name: Sign the component catalog
        if: inputs.publish-project != '' && inputs.runtime == 'win-x64' && hashFiles('publish-output/filer-component.cat') != ''
        uses: iyulab/code-sign@c4c68c25295ce0010a396d54cdb017fd248c5cce
        with:
          files: ${{ github.workspace }}/publish-output/filer-component.cat

      - name: Upload artifact
        if: inputs.publish-project != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: publish-output/
          # The catalog lists every file, dotfiles included (wwwroot/.gitkeep): upload-artifact leaves hidden files out by default,
          # and a zip made from the downloaded artifact then fails the launcher's own check against the catalog.
          include-hidden-files: true
          retention-days: 1
