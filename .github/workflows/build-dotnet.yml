name: .NET Build

on:
  workflow_call:
    inputs:
      solution:
        required: true
        type: string
      working-directory:
        required: true
        type: string
      test-filter:
        required: true
        type: string
      publish-project:
        required: false
        type: string
        default: ''
      runtime:
        required: false
        type: string
        default: ''
      artifact-name:
        required: false
        type: string
        default: ''
      source-ref:
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: >-
      ${{
        inputs.runtime == 'osx-arm64' && 'macos-latest' ||
        inputs.runtime == 'win-x64' && 'windows-latest' ||
        'ubuntu-latest'
      }}
    # Signing path uses OIDC federated credential, which requires the
    # job to run in the 'production' environment. Non-signing runs use
    # this environment harmlessly (no protection rules configured).
    environment: ${{ inputs.runtime == 'win-x64' && inputs.publish-project != '' && 'production' || '' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: iyulab/Filer
          token: ${{ secrets.RELEASE_TOKEN }}
          ref: ${{ inputs.source-ref || '' }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ inputs.solution }}

      - name: Build
        run: dotnet build ${{ inputs.solution }} --no-restore

      - name: Test
        run: >-
          dotnet test ${{ inputs.solution }} --no-build
          ${{ inputs.test-filter != '' && format('--filter "{0}"', inputs.test-filter) || '' }}

      # Hermeticity guard (Filer ISSUE-filer-20260717-0010): tests must never touch
      # the real user profile's Filer home. CI runners start with no ~/.filer, so ANY
      # file appearing there after the test run is proof of a leak (a suite booting
      # host code without FILER_HOME/FILER_SKIP_UI_CONFIG redirection).
      - name: Assert tests did not write $HOME/.filer
        shell: bash
        run: |
          if [ -d "$HOME/.filer" ]; then
            echo "::error::Tests created $HOME/.filer — a test suite is writing the real user profile (ISSUE-0010 class). Contents:"
            find "$HOME/.filer" -maxdepth 3 | head -50
            exit 1
          fi
          echo "hermeticity OK — no \$HOME/.filer created"

      - name: Publish
        if: inputs.publish-project != ''
        run: >-
          dotnet publish ${{ inputs.publish-project }}
          -c Release
          -r ${{ inputs.runtime }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish-output
        working-directory: .

      - name: Sign published executable
        if: inputs.publish-project != '' && inputs.runtime == 'win-x64'
        # Pinned to a specific commit SHA in iyulab/code-sign for supply-chain
        # safety; bump intentionally when the action is updated.
        uses: iyulab/code-sign@2a87f96983a3e79695eb5e8e98566650181abb7e
        with:
          # publish-output lives at repo root because the Publish step
          # runs with working-directory: '.'; use absolute path since
          # composite-action uses: steps inherit the job-level working-directory.
          files: ${{ github.workspace }}/publish-output/*.exe

      - name: Upload artifact
        if: inputs.publish-project != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: publish-output/
          retention-days: 1
