name: Electron Build

# No untrusted user input is used in run: blocks.
# All inputs come from workflow_call (caller-controlled).

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      platform-flag:
        required: true
        type: string
      source-ref:
        required: false
        type: string
        default: ''
    secrets:
      RELEASE_TOKEN:
        required: true
      AI_CONNECTION_STRING:
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Package Electron
    runs-on: ${{ inputs.os }}
    # Production environment is required for the OIDC federated credential
    # subject claim that gates Azure Key Vault access during signing.
    environment: ${{ inputs.os == 'windows-latest' && 'production' || '' }}
    defaults:
      run:
        working-directory: src/ui
    steps:
      - uses: actions/checkout@v6
        with:
          repository: iyulab/Filer
          token: ${{ secrets.RELEASE_TOKEN }}
          ref: ${{ inputs.source-ref || '' }}
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          MAIN_VITE_AI_CONNECTION_STRING: ${{ secrets.AI_CONNECTION_STRING }}

      - name: Verify telemetry connection string was inlined
        # Vite inlines `import.meta.env.MAIN_VITE_*` literals at build time;
        # an empty/missing secret causes dead-code elimination to strip the
        # entire telemetry init block, producing packaged builds that look
        # healthy but emit nothing. This step asserts (a) the secret is a
        # well-formed App Insights connection string and (b) its literal
        # value survived into the bundle. The UI gates init() on
        # isValidConnectionString(), which REQUIRES the literal
        # `InstrumentationKey=` segment — a raw IK GUID (no prefix) is
        # rejected at runtime and telemetry.init() becomes a silent no-op,
        # so we reject it here too. Skipped when the secret is intentionally
        # unset (e.g. fork/PR builds without repo secrets).
        #
        # NOTE: cannot use `if: ${{ secrets.X != '' }}` — GitHub disallows
        # secrets in step-level if-expressions, which causes a workflow-
        # parse error at trigger time on the calling workflow (release.yml).
        # The presence-check is therefore performed inside bash via env.
        #
        # `grep -qF` uses fixed-string matching so the secret is never
        # interpreted as a regex; output is suppressed (-q) so the secret
        # value never reaches the log even if grep would normally echo a
        # match. We never `echo "$AI_CONN"` directly.
        shell: bash
        env:
          AI_CONN: ${{ secrets.AI_CONNECTION_STRING }}
        run: |
          set -e
          if [ -z "$AI_CONN" ]; then
            echo "AI_CONNECTION_STRING is unset for this build; skipping inline verification."
            exit 0
          fi
          # A non-empty but malformed secret (e.g. a stale "-" placeholder)
          # passes the emptiness check above, gets inlined by Vite, then is
          # REJECTED at runtime by isValidConnectionString() — making
          # telemetry.init() a silent no-op and shipping a telemetry-dark
          # installer. Assert the `InstrumentationKey=` segment so a broken
          # secret fails the build LOUDLY instead. (Root cause of the
          # 2026-06-04 dark-telemetry incident: a length-1 "-" secret value
          # that grep-matched the bundle and passed the old length-only check.)
          case "$AI_CONN" in
            *InstrumentationKey=*) : ;;
            *)
              echo "::error::AI_CONNECTION_STRING is set (length ${#AI_CONN}) but lacks 'InstrumentationKey=' — runtime isValidConnectionString() rejects it and telemetry.init() becomes a silent no-op. Set AI_CONNECTION_STRING to the full App Insights connection string."
              exit 1
              ;;
          esac
          BUNDLE="out/main/index.js"
          if [ ! -f "$BUNDLE" ]; then
            echo "::error::expected $BUNDLE after npm run build"
            ls -la out/main/ || true
            exit 1
          fi
          if ! grep -qF "$AI_CONN" "$BUNDLE"; then
            echo "::error::AI_CONNECTION_STRING was set but did not survive into the bundle. Vite likely tree-shook the telemetry init path — check that MAIN_VITE_AI_CONNECTION_STRING is actually populated when 'npm run build' runs."
            exit 1
          fi
          echo "OK — telemetry connection string inlined into $BUNDLE (length = ${#AI_CONN})"

      - name: Package with electron-builder (dir target)
        run: npx electron-builder ${{ inputs.platform-flag }} --publish never
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Sign Electron main executable
        if: inputs.os == 'windows-latest'
        # Pinned to a specific commit SHA in iyulab/code-sign for supply-chain
        # safety; bump intentionally when the action is updated.
        uses: iyulab/code-sign@2a87f96983a3e79695eb5e8e98566650181abb7e
        with:
          # Filer.exe is the electron main process entry. Other DLLs in the
          # win-unpacked directory are signed by the Electron Foundation
          # upstream and accepted by SmartScreen / Smart App Control.
          files: ${{ github.workspace }}/src/ui/dist/win-unpacked/Filer.exe

      - name: Upload Electron unpacked
        uses: actions/upload-artifact@v7
        with:
          name: electron-dist-${{ inputs.os == 'windows-latest' && 'win' || 'mac' }}
          path: src/ui/dist/win-unpacked/
          retention-days: 1
